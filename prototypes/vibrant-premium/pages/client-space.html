      <section class="section auth-layout client-space-auth">

          <div class="client-summary" data-client-summary></div>
          <div class="account-section-title">
            <span>Bookings and history</span>
            <a class="section-action" href="booking.html">Book a new session</a>
          </div>
          <div class="booking-list compact-bookings" data-bookings-list></div>
        </article>
      </section>
    </main>
