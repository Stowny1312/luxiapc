<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <title>Coming soon! | Luxia P&amp;C</title>
    <meta name="description" content="Luxia P&C is coming soon.">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 12%, rgba(123, 214, 210, .28), transparent 34%),
          radial-gradient(circle at 88% 18%, rgba(217, 239, 157, .3), transparent 30%),
          linear-gradient(145deg, #f7fbfb 0%, #eef7f6 55%, #fffaf0 100%);
        color: #18343b;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(680px, calc(100% - 32px));
        padding: clamp(42px, 8vw, 76px) clamp(26px, 7vw, 64px);
        border: 1px solid rgba(137, 183, 180, .4);
        border-radius: 28px;
        background: rgba(255, 255, 255, .82);
        box-shadow: 0 28px 80px rgba(32, 76, 80, .14);
        text-align: center;
        backdrop-filter: blur(12px);
      }
      .brand {
        margin: 0 0 28px;
        color: #b58a27;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 11vw, 6.5rem);
        line-height: .96;
        letter-spacing: -.055em;
      }
      p:last-child {
        max-width: 470px;
        margin: 26px auto 0;
        color: #587078;
        font-size: clamp(1rem, 2.7vw, 1.18rem);
        line-height: 1.65;
      }
      .accent {
        width: 82px;
        height: 6px;
        margin: 30px auto 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #d9b34c, #7bd6d2, #d9ef9d);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Luxia P&amp;C · Prevention &amp; Coaching</p>
      <h1>Coming soon!</h1>
      <div class="accent" aria-hidden="true"></div>
      <p>We are preparing a thoughtful new space for clarity, growth, and conscious action. See you very soon.</p>
    </main>
  </body>
</html>
