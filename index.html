<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coming Soon</title>
    <meta name="description" content="Coming Soon">
    <style>
      :root {
        color-scheme: dark;
        --paper: #f8f4ea;
        --gold: #e7c46a;
        --blue: #6cc7ff;
        --rose: #ff7aa8;
        --black: #050506;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 120%, rgba(231, 196, 106, 0.26), transparent 34rem),
          linear-gradient(120deg, #050506 0%, #111013 42%, #020203 100%);
        color: var(--paper);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        inset: auto;
        content: "";
        pointer-events: none;
      }

      body::before {
        width: 70vmin;
        height: 70vmin;
        border: 1px solid rgba(231, 196, 106, 0.34);
        border-radius: 50%;
        box-shadow:
          0 0 0 14vmin rgba(231, 196, 106, 0.025),
          0 0 120px rgba(108, 199, 255, 0.16);
        animation: orbit 18s linear infinite;
      }

      body::after {
        inset: 0;
        background:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(circle at center, black 0%, transparent 68%);
      }

      main {
        position: relative;
        z-index: 1;
        width: min(1080px, calc(100vw - 32px));
        min-height: min(540px, calc(100vh - 32px));
        display: grid;
        place-items: center;
        padding: clamp(30px, 8vw, 96px);
        border: 1px solid rgba(248, 244, 234, 0.16);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(248, 244, 234, 0.1), rgba(248, 244, 234, 0.02)),
          rgba(255, 255, 255, 0.04);
        box-shadow:
          0 40px 110px rgba(0, 0, 0, 0.62),
          0 0 0 1px rgba(231, 196, 106, 0.12) inset;
        backdrop-filter: blur(20px);
      }

      .mark {
        position: absolute;
        width: 132px;
        height: 132px;
        right: clamp(20px, 6vw, 72px);
        top: clamp(20px, 6vw, 72px);
        border: 1px solid rgba(231, 196, 106, 0.42);
        border-radius: 50%;
        opacity: 0.8;
      }

      .mark::before,
      .mark::after {
        position: absolute;
        inset: 18px;
        content: "";
        border: 1px solid rgba(108, 199, 255, 0.34);
        border-radius: 50%;
      }

      .mark::after {
        inset: 42px;
        border-color: rgba(255, 122, 168, 0.38);
      }

      h1 {
        margin: 0;
        max-width: 960px;
        font-size: clamp(4.4rem, 14vw, 12.4rem);
        line-height: 0.84;
        font-weight: 900;
        letter-spacing: 0;
        text-align: center;
        text-transform: uppercase;
        text-shadow:
          0 0 38px rgba(231, 196, 106, 0.24),
          -4px 4px 0 rgba(108, 199, 255, 0.32),
          4px -4px 0 rgba(255, 122, 168, 0.22);
      }

      .line {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        opacity: 0.52;
      }

      .line.top {
        top: 22%;
      }

      .line.bottom {
        bottom: 22%;
      }

      @keyframes orbit {
        from {
          transform: rotate(0deg) translateX(2vmin) rotate(0deg);
        }
        to {
          transform: rotate(360deg) translateX(2vmin) rotate(-360deg);
        }
      }

      @media (max-width: 680px) {
        body {
          overflow: auto;
        }

        main {
          min-height: calc(100vh - 32px);
        }

        .mark {
          width: 92px;
          height: 92px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Coming Soon">
      <div class="line top"></div>
      <div class="mark" aria-hidden="true"></div>
      <h1>Coming Soon!</h1>
      <div class="line bottom"></div>
    </main>
  </body>
</html>
